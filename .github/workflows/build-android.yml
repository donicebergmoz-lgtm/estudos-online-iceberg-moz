name: Build Iceberg Moz Ruva Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/iceberg-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iceberg-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: app-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release bundle
        working-directory: app-android
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-moz-android-builds
          path: |
            app-android/app/build/outputs/apk/debug/*.apk
            app-android/app/build/outputs/bundle/release/*.aab
