name: Build Iceberg Moz Ruva Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: app-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release bundle
        working-directory: app-android
        run: gradle :app:bundleRelease --stacktrace
      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-moz-android-builds
          path: |
            app-android/app/build/outputs/apk/debug/*.apk
            app-android/app/build/outputs/bundle/release/*.aab
