<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Iceberg Moz Ruva</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f7faff;color:#08264e}.wrap{width:min(1100px,92%);margin:auto}.top{background:#08264e;color:#fff;padding:16px}.auth,.card{background:#fff;border:1px solid #d6e2f1;border-radius:14px;padding:24px;box-shadow:0 8px 25px #1232}.auth{max-width:440px;margin:60px auto}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #d6e2f1;border-radius:8px}button{border:0;border-radius:9px;padding:11px 15px;background:#1265d8;color:#fff;font-weight:bold;cursor:pointer;margin-right:6px}.alt{background:#fff;color:#1265d8;border:1px solid #1265d8}.msg{padding:11px;border-radius:8px;background:#e8f1fd;color:#154f9d;margin:12px 0}.danger{background:#fff0f0;color:#a32020}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:25px 0}.wide{grid-column:1/-1}li{padding:10px;border-top:1px solid #d6e2f1}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><b>📘 ICEBERG MOZ RUVA</b> — Painel de Administração</div></header><main class="wrap"><section id="auth" class="auth"><h2>Administrador</h2><p>Use <b>donicebergmoz@gmail.com</b> para a conta principal.</p><div id="notice" class="msg hide"></div><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Palavra-passe</label><input id="password" type="password" autocomplete="new-password"><button onclick="signIn()">Entrar</button><button class="alt" onclick="signUp()">Criar conta</button></section><section id="app" class="hide"><div id="status" class="msg"></div><div class="grid"><article class="card"><h3>Adicionar curso</h3><label>Nome</label><input id="course-name"><label>Ano</label><select id="course-year"><option value="1">1.º Ano</option><option value="2">2.º Ano</option><option value="3">3.º Ano</option><option value="4">4.º Ano</option></select><button onclick="addCourse()">Guardar</button></article><article class="card"><h3>Adicionar disciplina</h3><label>Curso</label><select id="subject-course"></select><label>Nome</label><input id="subject-name"><button onclick="addSubject()">Guardar</button></article><article class="card wide"><h3>Publicar material PDF</h3><label>Disciplina</label><select id="material-subject"></select><label>Título</label><input id="material-title"><label>Preço (MT)</label><input id="material-price" type="number" value="0"><label>Descrição</label><textarea id="material-description"></textarea><label>PDF</label><input id="material-file" type="file" accept="application/pdf"><label><input id="material-published" type="checkbox" checked style="width:auto"> Publicar agora</label><button onclick="addMaterial()">Carregar</button></article><article class="card"><h3>Cursos</h3><ul id="courses"></ul></article><article class="card"><h3>Disciplinas</h3><ul id="subjects"></ul></article><article class="card wide"><h3>Materiais</h3><ul id="materials"></ul></article></div><button class="alt" onclick="signOut()">Sair</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://eatuyxrilbknrjtvkxow.supabase.co','sb_publishable_YH8NaPtVCS2aroSVDRkbgg_RJwzo7uI');let user=null;const $=id=>document.getElementById(id);function note(t,bad=false){$('notice').textContent=t;$('notice').className='msg'+(bad?' danger':'')}function explain(e){return e?.message||e?.error_description||'Erro desconhecido. Tente novamente.'}async function signUp(){const e=$('email').value.trim().toLowerCase(),p=$('password').value;if(!e||!p)return note('Preencha o e-mail e a palavra-passe.',true);if(e!=='donicebergmoz@gmail.com')return note('Para criar a primeira conta de administrador, use donicebergmoz@gmail.com.',true);if(p.length<6)return note('A palavra-passe deve ter pelo menos 6 caracteres.',true);const r=await db.auth.signUp({email:e,password:p});if(r.error)return note('Não foi possível criar a conta: '+explain(r.error),true);if(r.data.session){note('Conta criada. A entrar no painel...');await boot()}else note('Conta criada com sucesso. Abra o Gmail, confirme o endereço e depois clique em Entrar.');}async function signIn(){const e=$('email').value.trim().toLowerCase(),p=$('password').value;if(!e||!p)return note('Preencha o e-mail e a palavra-passe.',true);const r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)return note('Não foi possível entrar: '+explain(r.error),true);await boot()}async function boot(){const r=await db.auth.getUser();user=r.data.user;if(!user)return;if(user.email.toLowerCase()!=='donicebergmoz@gmail.com'){await db.auth.signOut();return note('Este e-mail não é o administrador.',true)}let p=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error)return note('Erro ao consultar o perfil: '+p.error.message,true);if(!p.data||p.data.role!=='admin'){await db.auth.signOut();return note('A conta existe, mas ainda não recebeu a função de administrador. Tente sair, aguardar alguns segundos e entrar novamente.',true)}$('auth').classList.add('hide');$('app').classList.remove('hide');$('status').textContent='Administrador conectado: '+user.email;load()}async function signOut(){await db.auth.signOut();location.reload()}async function load(){let a=await db.from('courses').select('*').order('year').order('name');if(a.error)return note('Erro nos cursos: '+a.error.message,true);$('courses').innerHTML=(a.data||[]).map(x=>'<li><b>'+esc(x.name)+'</b> — '+x.year+'º Ano</li>').join('')||'<li>Nenhum curso cadastrado.</li>';$('subject-course').innerHTML=(a.data||[]).map(x=>'<option value="'+x.id+'">'+x.year+'º — '+esc(x.name)+'</option>').join('');let s=await db.from('subjects').select('*,courses(name,year)').order('name');if(s.error)return note('Erro nas disciplinas: '+s.error.message,true);$('subjects').innerHTML=(s.data||[]).map(x=>'<li><b>'+esc(x.name)+'</b> — '+esc(x.courses?.name||'')+'</li>').join('')||'<li>Nenhuma disciplina cadastrada.</li>';$('material-subject').innerHTML=(s.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.courses?.name||'')+' — '+esc(x.name)+'</option>').join('');let m=await db.from('materials').select('*,subjects(name)').order('created_at',{ascending:false});if(m.error)return note('Erro nos materiais: '+m.error.message,true);$('materials').innerHTML=(m.data||[]).map(x=>'<li><b>'+esc(x.title)+'</b> — '+esc(x.subjects?.name||'')+' — '+x.price_mzn+' MT</li>').join('')||'<li>Nenhum material cadastrado.</li>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function addCourse(){const r=await db.from('courses').insert({name:$('course-name').value.trim(),year:+$('course-year').value});if(r.error)return alert(r.error.message);$('course-name').value='';load()}async function addSubject(){const r=await db.from('subjects').insert({name:$('subject-name').value.trim(),course_id:$('subject-course').value});if(r.error)return alert(r.error.message);$('subject-name').value='';load()}async function addMaterial(){const f=$('material-file').files[0];if(!f)return alert('Escolha um PDF.');if(f.type!=='application/pdf'||f.size>20971520)return alert('O ficheiro deve ser PDF e ter no máximo 20 MB.');const path='admin/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await db.storage.from('materials').upload(path,f,{contentType:'application/pdf'});if(u.error)return alert(u.error.message);let r=await db.from('materials').insert({subject_id:$('material-subject').value,title:$('material-title').value.trim(),description:$('material-description').value,price_mzn:+$('material-price').value,file_path:path,published:$('material-published').checked,created_by:user.id});if(r.error){await db.storage.from('materials').remove([path]);return alert(r.error.message)}load()}boot();</script></body></html>
